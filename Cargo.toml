[package]
name = "racedet"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-core = { version = "0.3.31", default-features = false, features = [] }
futures-executor = { version = "0.3.31", default-features = false, features = ["std"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
itertools = { version = "0.14.0", default-features = false, features = ["use_std"] }
pin-project-lite = { version = "0.2.16", default-features = false }
rand = { version = "0.9.2", default-features = false, features = ["thread_rng"] }
tokio = { version = "1.48.0", default-features = false, features = ["sync", "rt", "time"] }
tracing = { version = "0.1.41", default-features = false }

[dev-dependencies]
axum = { version = "0.8.7" }
futures = { version = "0.3.31" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
timeout-tracing = "0.1.2"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
tokio-util = "0.7.17"
tower = "0.5.2"
tracing-subscriber = { version = "0.3.20" }

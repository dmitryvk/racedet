[package]
name = "conc-checker"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.31"
futures-util = "0.3.31"
itertools = "0.14.0"
pin-project = "1.1.10"
rand = "0.9.2"
timeout-tracing = "0.1.2"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
axum = { version = "0.8.7", features = ["macros"] }
hyper = "1.8.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio-util = "0.7.17"
tower = "0.5.2"
